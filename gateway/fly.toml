# Deploy:  fly launch --no-deploy --copy-config  &&  fly secrets set INGEST_TOKEN=... INGEST_URL=https://qhxdqgkpebmpzzuzqcla.supabase.co/functions/v1/ingest-tracker  &&  fly deploy
# Then allocate a dedicated IPv4 (needed for raw TCP from the device):  fly ips allocate-v4
app = "textrak-gateway"
primary_region = "lhr"

[build]

[env]
  PORT = "5027"

[[services]]
  protocol = "tcp"
  internal_port = 5027
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 5027
