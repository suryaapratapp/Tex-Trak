# Teltonika TCP gateway on Fly.io.
# Deploy steps are in docs/TOM_SETUP.md and the README. The secret INGEST_TOKEN is set with `fly secrets set`, never here.
app = 'textrak-gateway'
primary_region = 'lhr'

[build]

[env]
  PORT = '5027'
  INGEST_URL = 'https://qhxdqgkpebmpzzuzqcla.supabase.co/functions/v1/ingest-tracker'

# Raw TCP for the tracker (not HTTP). A dedicated IPv4 address is needed: fly ips allocate-v4
[[services]]
  protocol = 'tcp'
  internal_port = 5027
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 5027

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
